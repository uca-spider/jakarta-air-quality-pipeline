name: check-new-files

on:
  schedule:
    - cron: "0 2 * * 1" # every Monday 02:00 UTC. GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for keyless Google Cloud authentication

concurrency:
  group: check-new-files
  cancel-in-progress: false

jobs:
  discover-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INGEST_SA }}
      - name: Find new ISPU files and load them
        run: python -m src.ingestion.discover
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RAW_BUCKET: ${{ vars.RAW_BUCKET }}
