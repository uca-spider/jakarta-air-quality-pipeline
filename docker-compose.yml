services:
  # Base service template containing shared configurations
  base: &base
    build:
      context: .
      dockerfile: Dockerfile
    image: jakarta-aq-pipeline:latest
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/aq-key.json
      - GCP_PROJECT=${GCP_PROJECT:-jakarta-air-quality}
      - RAW_BUCKET=${RAW_BUCKET:-hudza-aq-raw}
      - DBT_PROFILES_DIR=/app/dbt
    volumes:
      # Mount GCP credentials and local raw data read-only
      - ${GCP_KEY_PATH:-${GOOGLE_APPLICATION_CREDENTIALS:-/mnt/c/Users/DELL/gcp-keys/aq-key.json}}:/app/credentials/aq-key.json:ro
      - ./data:/app/data:ro

  # 1. Run Python unit & integration test suite (now 80 tests!)
  test:
    <<: *base
    command: ["pytest", "-v"]

  # 2. Run CLI Ingestion into GCS Bucket (Bronze) and BigQuery (Raw)
  ingest:
    <<: *base
    command: ["python", "-m", "src.ingestion.cli", "--dir", "data/raw/", "--load", "--project", "${GCP_PROJECT:-jakarta-air-quality}", "--bucket", "${RAW_BUCKET:-hudza-aq-raw}"]

  # 3. Execute dbt models (Staging views + Marts partitioned tables)
  dbt-run:
    <<: *base
    working_dir: /app/dbt
    command: ["dbt", "run"]

  # 4. Run dbt automated data quality tests (16 tests)
  dbt-test:
    <<: *base
    working_dir: /app/dbt
    command: ["dbt", "test"]

  # 5. Full Pipeline end-to-end (Backup to GCS + Ingest raw BQ -> dbt run -> dbt test)
  pipeline:
    <<: *base
    command: >
      sh -c "python -m src.ingestion.cli --dir data/raw/ --load --project ${GCP_PROJECT:-jakarta-air-quality} --bucket ${RAW_BUCKET:-hudza-aq-raw} &&
             cd /app/dbt &&
             dbt run &&
             dbt test"

  # 6. REST API (FastAPI). Runs in offline 'sample' mode by default, so it needs
  #    NO GCP credentials. Set API_DATA_MODE=live to query BigQuery via ADC.
  #    Swagger UI: http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jakarta-aq-pipeline:latest
    environment:
      - API_DATA_MODE=${API_DATA_MODE:-sample}
      - API_GCP_PROJECT=${GCP_PROJECT:-jakarta-air-quality}
      - API_MARTS_DATASET=${API_MARTS_DATASET:-aq_marts}
      - API_RAW_DATASET=${API_RAW_DATASET:-aq_raw}
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
