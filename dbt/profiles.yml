jakarta_air_quality:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT', 'jakarta-air-quality') }}"
      dataset: aq_staging
      threads: 4
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      location: asia-southeast2
      priority: interactive
      timeout_seconds: 300
